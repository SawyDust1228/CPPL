[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "circuitppl"
version = "0.1.0"
description = "A Python DSL for hardware description with LLM-powered compilation"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=1,<2",
    "langchain-openai>=1,<2",
    "langchain-anthropic>=1,<2",
    "langgraph>=1,<2",
    "pycde==0.9.1.dev146",
    "termcolor<3",
]

[tool.setuptools.packages.find]
include = ["cppl*"]
